<!DOCTYPE html>
<html>
<head>
    <title>Menghitung Luas Bangun</title>
</head>
<body>

<script>

    // Fungsi menghitung luas persegi panjang
    function luasPersegiPanjang() {
        let panjang = 10;
        let tinggi = 5;
        let luas = panjang * tinggi;

        document.write("Luas Persegi Panjang = " + luas + "<br>");
    }

    // Fungsi menghitung luas bujur sangkar
    function luasBujurSangkar() {
        let sisi = 8;
        let luas = sisi * sisi;

        document.write("Luas Bujur Sangkar = " + luas + "<br>");
    }

    // Fungsi menghitung luas segitiga
    function luasSegitiga() {
        let alas = 10;
        let tinggi = 6;
        let luas = 0.5 * alas * tinggi;

        document.write("Luas Segitiga = " + luas);
    }

    luasPersegiPanjang();
    luasBujurSangkar();
    luasSegitiga();

</script>

</body>
</html>
